version: '3.8'

services:
  # Production application service
  app:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: jwt-todo-app-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    networks:
      - todo-network
    depends_on:
      - postgres
      - redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Production PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: jwt-todo-postgres-prod
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - todo-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Production Redis
  redis:
    image: redis:7-alpine
    container_name: jwt-todo-redis-prod
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - todo-network
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Production Nginx with SSL
  nginx:
    image: nginx:alpine
    container_name: jwt-todo-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    networks:
      - todo-network
    depends_on:
      - app
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # Log aggregation
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: jwt-todo-fluentd
    volumes:
      - ./logging/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./logs:/var/log/fluentd
    networks:
      - todo-network
    restart: always

  # Backup service
  backup:
    image: postgres:15-alpine
    container_name: jwt-todo-backup
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - todo-network
    depends_on:
      - postgres
    restart: "no"
    command: /bin/sh -c "while true; do /backup.sh; sleep 86400; done"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  todo-network:
    driver: bridge


